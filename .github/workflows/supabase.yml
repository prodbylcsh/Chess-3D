name: Deploy Supabase backend

# Applies database migrations, copies the shop catalogue into the database (supabase/catalog.ts), deploys the Edge Functions (`game`, `account`, `social`, `play`, `payments`) and sets the
# auth settings and email templates from supabase/config.toml (supabase/auth-config.ts)
# whenever anything under supabase/ changes on main, then smoke-tests the live project
# (tests/live.smoke.ts; leaves a few anonymous guests and one finished game behind). Needs, in Settings → Secrets and
# variables → Actions:
#   secrets:   SUPABASE_ACCESS_TOKEN  (supabase.com/dashboard/account/tokens)
#              SUPABASE_DB_PASSWORD   (the database password chosen at project creation)
#   variables: SUPABASE_PROJECT_ID    (the project ref, e.g. abcdefghijklmnopqrst)
# and for buying coins (Paddle, docs/PLATFORM.md §8.4), once they exist:
#   secrets:   PADDLE_API_KEY, PADDLE_WEBHOOK_SECRET
#   variables: PADDLE_ENV             ('sandbox' until live payments, then 'production')

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
      PADDLE_WEBHOOK_SECRET: ${{ secrets.PADDLE_WEBHOOK_SECRET }}
      PADDLE_ENV: ${{ vars.PADDLE_ENV }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "$PROJECT_ID"
      - run: npx supabase db push
      # the shop catalogue into the `items` table (before the functions that sell it)
      - run: node supabase/catalog.ts --linked
      - run: npx supabase functions deploy game --project-ref "$PROJECT_ID" --use-api
      - run: npx supabase functions deploy account --project-ref "$PROJECT_ID" --use-api
      - run: npx supabase functions deploy social --project-ref "$PROJECT_ID" --use-api
      - run: npx supabase functions deploy play --project-ref "$PROJECT_ID" --use-api
      - run: npx supabase functions deploy payments --project-ref "$PROJECT_ID" --use-api
      # the payments function's Paddle secrets (never printed); without them it sells nothing
      - name: Paddle secrets
        if: env.PADDLE_API_KEY != ''
        run: npx supabase secrets set --project-ref "$PROJECT_ID" PADDLE_API_KEY="$PADDLE_API_KEY" PADDLE_WEBHOOK_SECRET="$PADDLE_WEBHOOK_SECRET" PADDLE_ENV="${PADDLE_ENV:-sandbox}" >/dev/null
      - run: node supabase/auth-config.ts
      - run: node --test tests/live.smoke.ts
