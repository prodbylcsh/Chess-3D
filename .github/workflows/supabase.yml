name: Deploy Supabase backend

# Applies database migrations, deploys the Edge Functions (`game`, `account`) and sets the
# auth settings and email templates from supabase/config.toml (supabase/auth-config.ts)
# whenever anything under supabase/ changes on main, then smoke-tests the live project
# (tests/live.smoke.ts; leaves a few anonymous guests and one finished game behind). Needs, in Settings → Secrets and
# variables → Actions:
#   secrets:   SUPABASE_ACCESS_TOKEN  (supabase.com/dashboard/account/tokens)
#              SUPABASE_DB_PASSWORD   (the database password chosen at project creation)
#   variables: SUPABASE_PROJECT_ID    (the project ref, e.g. abcdefghijklmnopqrst)

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "$PROJECT_ID"
      - run: npx supabase db push
      - run: npx supabase functions deploy game --project-ref "$PROJECT_ID" --use-api
      - run: npx supabase functions deploy account --project-ref "$PROJECT_ID" --use-api
      - run: node supabase/auth-config.ts
      - run: node --test tests/live.smoke.ts
